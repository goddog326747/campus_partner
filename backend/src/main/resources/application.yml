server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.192.128:13306/campus_partner?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    username: root
    password: "123456"
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: CampusPartner_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# Logging Configuration
logging:
  level:
    com.example.project.service.impl.AiServiceImpl: DEBUG
    com.example.project.controller.AiController: DEBUG
    org.springframework.web: DEBUG
    com.alibaba: DEBUG
    okhttp3: DEBUG

# MyBatis Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
